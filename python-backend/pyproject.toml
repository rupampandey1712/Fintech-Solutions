[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fincore-python"
version = "0.1.0"
description = "FinCore fintech platform Python API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "PyJWT>=2.9,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "structlog>=24.4,<26.0",
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
  # The asyncpg driver, not SQLAlchemy: its instrumentation lags SQLAlchemy releases.
  "opentelemetry-instrumentation-asyncpg>=0.48b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.48b0,<1.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
  "azure-servicebus>=7.14,<8.0",
  "azure-storage-blob[aio]>=12.24,<13.0",
  "redis>=5.0,<7.0",
  # The demo seeder (app.seed) drives the API in-process over ASGI.
  "httpx>=0.27,<1.0",
  # Fraud investigator agent (app.agents): a LangGraph state graph over a Gemini chat model.
  "langgraph>=1.2,<2.0",
  "langchain-core>=1.6,<2.0",
  "langchain-google-genai>=4.4,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<2.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection relies on Depends/require_roles in argument defaults.
"app/api/**" = ["B008"]
# conftest must configure env vars before importing app modules.
"tests/conftest.py" = ["E402"]
